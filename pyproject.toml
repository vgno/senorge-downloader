[project]
name = "senorge-downloader"
version = "0.1.0"
description = "Downloads NetCDF files from MET and converts them to aggregated CSVs for VG outputs"
authors = [{ name = "Jari Bakken", email = "jari@vg.no" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "black>=24.10.0",
    "certifi>=2024.12.14",
    "cftime>=1.6.4",
    "click>=8.1.8",
    "click-plugins>=1.1.1",
    "cligj>=0.7.2",
    "contourpy>=1.3.1",
    "dask[diagnostics]>=2024.12.1",
    "fiona>=1.10.1",
    "flox>=0.9.15",
    "fonttools>=4.55.3",
    "geopandas>=1.0.1",
    "ipykernel>=6.29.5",
    "ipython>=8.31.0",
    "jinja2>=3.1.5",
    "jupyter-client>=8.6.3",
    "jupyter-core>=5.7.2",
    "matplotlib>=3.10.0",
    "netcdf4>=1.7.2",
    "numpy>=2.2.1",
    "pandas>=2.2.3",
    "pillow>=11.1.0",
    "plac>=1.4.3",
    "pyproj>=3.7.0",
    "requests>=2.32.3",
    "s3fs>=2024.12.0",
    "shapely>=2.0.6",
    "sqlalchemy>=2.0.36",
    "tornado>=6.4.2",
    "tqdm>=4.67.1",
    "xarray>=2024.11.0",
]

[project.scripts]
senorge = "senorge_downloader.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["senorge_downloader"]
